<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vocab~Master{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* surfaces — cool bluish-white */
            --bg: #F3F6FB;
            --bg-2: #E6ECF5;
            --bg-3: #D3DCEA;

            /* text — deep cool navy */
            --t-primary: #0E1A2D;
            --t-secondary: #38465E;
            --t-tertiary: #6E7A91;

            /* borders */
            --b-primary: #0E1A2D;
            --b-secondary: rgba(14, 26, 45, 0.28);
            --b-tertiary: rgba(14, 26, 45, 0.12);

            /* accent (warm vermillion — pops against cool bg) */
            --accent: #C8401C;
            --accent-soft: #F8DCD0;

            /* status: success / info / warning / danger */
            --s-success-bg: #D6E8DA;
            --s-success-fg: #2F5D3A;
            --s-success-bd: #B5CFB9;
            --s-info-bg: #DCE6F2;
            --s-info-fg: #2D4574;
            --s-info-bd: #B7C5DD;
            --s-warning-bg: #F4E6CC;
            --s-warning-fg: #7E5414;
            --s-warning-bd: #E1C893;
            --s-danger-bg: #F1D9D9;
            --s-danger-fg: #8B1E2D;
            --s-danger-bd: #E0B5B5;

            /* fonts */
            --serif: 'Newsreader', 'Times New Roman', serif;
            --sans: 'Instrument Sans', system-ui, sans-serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;

            /* radii */
            --r-sm: 5px;
            --r-md: 8px;
            --r-lg: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--t-primary);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.55;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; }
        ::selection { background: var(--accent); color: var(--bg); }

        h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; margin: 0; }
        h1.display { font-weight: 450; line-height: 1.05; }
        h1.display em { font-style: italic; color: var(--accent); }
        p { margin: 0 0 1em; }

        .shell { max-width: 1180px; margin: 0 auto; padding: 22px 44px 80px; }
        @media (max-width: 720px) { .shell { padding: 18px 20px 56px; } }

        /* ── masthead ──────────────────────────────────────── */
        .masthead {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0 16px; margin-bottom: 32px;
            border-bottom: 0.5px solid var(--b-tertiary);
            gap: 16px; flex-wrap: wrap;
        }
        .brand {
            font-family: var(--serif); font-weight: 600;
            font-size: 21px; letter-spacing: -0.02em;
        }
        .brand .swung { font-style: italic; color: var(--accent); }
        .nav-links { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
        .nav-link {
            font-family: var(--sans); font-size: 13px; font-weight: 500;
            color: var(--t-secondary); padding: 6px 0;
            position: relative;
            transition: color 0.15s;
        }
        .nav-link:hover { color: var(--t-primary); }
        .nav-link.current { color: var(--t-primary); }
        .nav-link.current::after {
            content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
            height: 2px; background: var(--accent);
        }
        .logout-form { display: inline; margin: 0; }
        .logout-form button {
            background: none; border: none; padding: 6px 0;
            font: inherit; font-weight: 500; color: var(--t-secondary);
            transition: color 0.15s;
        }
        .logout-form button:hover { color: var(--t-primary); }

        .voice-toggle {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--bg-2); border: 0.5px solid var(--b-tertiary);
            border-radius: var(--r-md); padding: 5px 10px;
            font-family: var(--sans); font-size: 12px; font-weight: 500;
            color: var(--t-secondary); cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .voice-toggle:hover { color: var(--t-primary); border-color: var(--b-secondary); }
        .voice-toggle.on { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }
        .voice-toggle .vt-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--t-tertiary); display: inline-block;
            transition: background 0.15s, box-shadow 0.15s;
        }
        .voice-toggle.on .vt-dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .voice-toggle .vt-label { font-size: 12px; }

        /* ── buttons ───────────────────────────────────────── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 9px 18px;
            background: var(--t-primary); color: var(--bg);
            border: 0.5px solid var(--t-primary); border-radius: var(--r-md);
            font-family: var(--sans); font-size: 13px; font-weight: 500;
            cursor: pointer; transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
            white-space: nowrap; text-decoration: none;
        }
        .btn:hover { opacity: 0.85; }
        .btn.ghost { background: transparent; color: var(--t-primary); border-color: var(--b-secondary); }
        .btn.ghost:hover { background: var(--bg-2); opacity: 1; }
        .btn.accent { background: var(--accent); border-color: var(--accent); }
        .btn.large { padding: 12px 24px; font-size: 15px; border-radius: var(--r-md); }
        .btn.disabled { opacity: 0.4; pointer-events: none; }
        .btn .arrow { transition: transform 0.15s; }
        .btn:hover .arrow { transform: translateX(2px); }
        .btn.full { width: 100%; }

        .text-link { color: var(--accent); border-bottom: 1px solid var(--accent); padding-bottom: 1px; font-weight: 500; }
        .text-link:hover { color: var(--t-primary); border-color: var(--t-primary); }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            font-family: var(--sans); font-size: 13px; font-weight: 500;
            color: var(--t-tertiary); transition: color 0.15s, gap 0.15s;
        }
        .back-link:hover { color: var(--t-primary); gap: 10px; }

        /* ── primitives ────────────────────────────────────── */
        .surface {
            background: var(--bg);
            border: 0.5px solid var(--b-tertiary);
            border-radius: var(--r-lg);
            padding: 20px 22px;
        }
        .stat {
            background: var(--bg-2);
            border-radius: var(--r-md);
            padding: 14px 18px;
            display: flex; flex-direction: column; gap: 4px;
            border-left: 3px solid transparent;
        }
        .stat.tint-accent { background: var(--accent-soft); border-left-color: var(--accent); }
        .stat.tint-success { background: var(--s-success-bg); border-left-color: var(--s-success-fg); }
        .stat.tint-info { background: var(--s-info-bg); border-left-color: var(--s-info-fg); }
        .stat-label { font-size: 12px; color: var(--t-tertiary); font-weight: 500; }
        .stat.tint-accent .stat-label { color: var(--accent); opacity: 0.85; }
        .stat.tint-success .stat-label { color: var(--s-success-fg); opacity: 0.85; }
        .stat.tint-info .stat-label { color: var(--s-info-fg); opacity: 0.85; }
        .stat-value { font-size: 22px; font-weight: 500; line-height: 1.1; color: var(--t-primary); font-family: var(--serif); letter-spacing: -0.015em; }
        .stat-value.xp { color: var(--accent); }
        .stat-value.success { color: var(--s-success-fg); }
        .stat-value.info { color: var(--s-info-fg); }

        .badge {
            display: inline-flex; align-items: center;
            font-size: 11px; font-weight: 500; padding: 2px 9px;
            border-radius: var(--r-md); white-space: nowrap; line-height: 1.5;
        }
        .badge-success { background: var(--s-success-bg); color: var(--s-success-fg); }
        .badge-info { background: var(--s-info-bg); color: var(--s-info-fg); }
        .badge-warning { background: var(--s-warning-bg); color: var(--s-warning-fg); }
        .badge-danger { background: var(--s-danger-bg); color: var(--s-danger-fg); }
        .badge-neutral { background: var(--bg-2); color: var(--t-tertiary); border: 0.5px solid var(--b-tertiary); }

        .word-tag {
            display: inline-block; margin: 1px 2px;
            font-family: var(--mono); font-size: 10px;
            color: var(--t-tertiary); background: var(--bg-2);
            padding: 2px 7px; border-radius: 4px;
        }

        .ptrack { height: 3px; background: var(--bg-2); border-radius: 4px; overflow: hidden; }
        .pfill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .pfill-success { background: var(--s-success-fg); }
        .pfill-info { background: var(--s-info-fg); }
        .pfill-accent { background: var(--accent); }

        .eyebrow {
            display: inline-block;
            font-family: var(--sans); font-size: 12px; font-weight: 600;
            color: var(--accent); letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .meta-text { font-family: var(--sans); font-size: 12px; color: var(--t-tertiary); }
        .num { font-family: var(--mono); font-feature-settings: "tnum"; font-weight: 500; }

        .hidden-section { display: none !important; }

        .t-success { color: var(--s-success-fg); }
        .t-info { color: var(--s-info-fg); }
        .t-warning { color: var(--accent); }
        .t-danger { color: var(--s-danger-fg); }
        .t-tertiary { color: var(--t-tertiary); }

        /* ── animations ────────────────────────────────────── */
        .reveal { animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
        .reveal.d2 { animation-delay: 0.06s; }
        .reveal.d3 { animation-delay: 0.12s; }
        .reveal.d4 { animation-delay: 0.18s; }
        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="shell">
        {% block masthead %}
        {% with url_name=request.resolver_match.url_name %}
        <header class="masthead">
            <a class="brand" href="{% if user.is_authenticated %}{% url 'unit_hub' %}{% else %}{% url 'home' %}{% endif %}">Vocab<span class="swung">~</span>Master</a>
            <nav class="nav-links">
                {% if user.is_authenticated %}
                    <a class="nav-link {% if url_name == 'unit_hub' or url_name == 'unit_detail' or url_name == 'flashcards' or url_name == 'quiz_detail' %}current{% endif %}" href="{% url 'unit_hub' %}">Library</a>
                    <a class="nav-link {% if url_name == 'ranking' %}current{% endif %}" href="{% url 'ranking' %}">Leaderboard</a>
                    <button type="button" class="voice-toggle" id="voice-toggle" aria-pressed="false" title="Toggle pronunciation">
                        <span class="vt-dot" id="vt-dot" aria-hidden="true"></span>
                        <span class="vt-label" id="vt-label">Voice off</span>
                    </button>
                    <form method="POST" action="{% url 'logout' %}" class="logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-link">Sign out</button>
                    </form>
                {% else %}
                    <a class="nav-link {% if url_name == 'login' %}current{% endif %}" href="{% url 'login' %}">Sign in</a>
                    <a class="btn accent" href="{% url 'register' %}">Get started</a>
                {% endif %}
            </nav>
        </header>
        {% endwith %}
        {% endblock %}

        {% block content %}{% endblock %}
    </div>

    <script>
    (function() {
        const STORE_KEY = 'vq_tts_enabled';
        const supported = 'speechSynthesis' in window;
        let enabled = supported && localStorage.getItem(STORE_KEY) === '1';
        let preferredVoice = null;

        function pickVoice() {
            if (!supported) return;
            const voices = speechSynthesis.getVoices();
            if (!voices.length) return;
            const isEn = v => v.lang && v.lang.toLowerCase().startsWith('en');

            // Tiered priority: best-known neural voices first, then "natural"/"premium"
            // markers, then OS defaults, then any English voice.
            const namePriority = [
                /Microsoft Aria Online/i,           // Edge neural
                /Microsoft Jenny Online/i,
                /Microsoft Guy Online/i,
                /Microsoft (Aria|Jenny|Guy|Davis|Emma|Brian)/i,
                /Google US English/i,                // Chrome neural-ish
                /Google UK English Female/i,
                /Google UK English Male/i,
                /Google.*English/i,
                /Ava \(Premium\)/i,                  // macOS premium voices
                /Allison \(Premium\)/i,
                /Evan \(Premium\)/i,
                /Samantha \(Premium\)/i,
                /Joelle \(Premium\)/i,
                /Zoe \(Premium\)/i,
                /\(Premium\)/i,
                /\(Enhanced\)/i,
                /Neural|Natural|Studio|Wavenet/i,
                /Samantha/i,                         // macOS default
                /Karen/i,                            // au-AU but pleasant
                /Daniel/i,                           // en-GB
            ];

            for (const re of namePriority) {
                const found = voices.find(v => isEn(v) && re.test(v.name));
                if (found) { preferredVoice = found; return; }
            }
            // Any local en-US voice (localService = OS-provided, often better latency)
            preferredVoice =
                voices.find(v => v.lang === 'en-US' && v.localService) ||
                voices.find(v => v.lang === 'en-US') ||
                voices.find(isEn) ||
                voices[0];
        }
        if (supported) {
            pickVoice();
            speechSynthesis.onvoiceschanged = pickVoice;
        }

        function speak(text) {
            if (!supported || !enabled || !text) return;
            try {
                if (!preferredVoice) pickVoice();
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                if (preferredVoice) u.voice = preferredVoice;
                u.lang = (preferredVoice && preferredVoice.lang) || 'en-US';
                u.rate = 0.85;
                u.pitch = 1.0;
                u.volume = 1.0;
                speechSynthesis.speak(u);
            } catch (_) {}
        }

        function applyToggleUI() {
            const btn = document.getElementById('voice-toggle');
            if (!btn) return;
            const label = document.getElementById('vt-label');
            btn.classList.toggle('on', enabled);
            btn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
            if (label) label.textContent = enabled ? 'Voice on' : 'Voice off';
        }

        function setEnabled(v) {
            enabled = !!v && supported;
            localStorage.setItem(STORE_KEY, enabled ? '1' : '0');
            applyToggleUI();
            if (!enabled && supported) speechSynthesis.cancel();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('voice-toggle');
            if (!btn) return;
            if (!supported) {
                btn.disabled = true;
                btn.title = 'Speech synthesis not supported in this browser';
                btn.style.opacity = '0.5';
                document.getElementById('vt-label').textContent = 'No voice';
                return;
            }
            applyToggleUI();
            btn.addEventListener('click', () => setEnabled(!enabled));
        });

        window.vqTts = {
            speak,
            get enabled() { return enabled; },
            get supported() { return supported; },
        };
    })();
    </script>
</body>
</html>
