<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabMaster | {{ unit.title }} Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-bone { background-color: #F0EFE7; }
        .text-navy { color: #003153; }
        .bg-navy { background-color: #003153; }

        /* Flip Card Logic */
        .flip-card {
            perspective: 1000px;
            height: 400px;
            cursor: pointer;
            width: 100%;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2rem; /* 32px roughly */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 2rem;
        }
        .flip-card-front {
            background-color: white;
            color: #003153;
        }
        .flip-card-back {
            background-color: #003153;
            color: white;
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-bone text-navy font-sans py-12 px-6 flex flex-col min-h-screen">
    
    <!-- Pass cards to JS safely -->
    <script id="cards-data" type="application/json">
        [
            {% for card in cards %}
                {"word": "{{ card.word|escapejs }}", "definition": "{{ card.definition|escapejs }}"}{% if not forloop.last %},{% endif %}
            {% endfor %}
        ]
    </script>

    <div class="max-w-3xl mx-auto w-full flex-grow flex flex-col">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <a href="{% url 'unit_detail' unit.slug %}" class="bg-white px-4 py-2 rounded-full font-bold shadow hover:-translate-y-1 transition-transform">
                ← Back to Menu
            </a>
            <div class="font-black opacity-60 uppercase tracking-widest text-sm">
                {{ unit.title }} (<span id="currentCardIndex">0</span>/<span id="totalCards">0</span>)
            </div>
        </div>

        <div id="main-content" class="flex-grow flex flex-col justify-center">
            <!-- Flashcards will be injected here -->
            <div id="flashcards-container" class="relative mb-12 flex justify-center">
                <!-- Card JS injected here -->
            </div>

            <!-- Controls -->
            <div class="flex flex-col items-center gap-6" id="controls-container">
                <div class="flex gap-4">
                    <button onclick="markDontKnow()" class="bg-red-500 text-white px-6 py-3 rounded-full font-black shadow-lg hover:-translate-y-1 transition-transform active:translate-y-0">
                        I don't know 😥
                    </button>
                    <button onclick="markKnow()" class="bg-green-500 text-white px-6 py-3 rounded-full font-black shadow-lg hover:-translate-y-1 transition-transform active:translate-y-0">
                        I know it! 😎
                    </button>
                </div>
            </div>
        </div>
        
        <div id="empty-state" class="bg-white p-12 text-center rounded-[32px] shadow-lg hidden">
            <p class="text-xl font-bold text-gray-500 mb-6">You've mastered all the cards! 🎉</p>
            <a href="{% url 'quiz_detail' unit.slug %}" class="bg-yellow-400 text-navy px-8 py-4 rounded-xl font-black shadow-[0_6px_0_rgb(161,98,7)] hover:-translate-y-1 active:translate-y-1 active:shadow-none transition-all text-lg">
                Take the Quiz Now
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const rawData = document.getElementById('cards-data').textContent;
            let cardDeck = JSON.parse(rawData);
            let originalCount = cardDeck.length;

            if (cardDeck.length === 0) {
                document.getElementById('main-content').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                document.querySelector('#empty-state p').innerText = "No flashcards available in this unit.";
                return;
            }

            let currentIndex = 0;

            const container = document.getElementById('flashcards-container');
            const currentCounter = document.getElementById('currentCardIndex');
            const totalCounter = document.getElementById('totalCards');

            function renderCard() {
                if (currentIndex >= cardDeck.length) {
                    // Finished deck
                    document.getElementById('main-content').classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                }

                currentCounter.innerText = currentIndex + 1;
                totalCounter.innerText = cardDeck.length;

                const cardData = cardDeck[currentIndex];
                
                container.innerHTML = `
                    <div class="flip-card" onclick="this.classList.toggle('flipped')">
                        <div class="flip-card-inner">
                            <div class="flip-card-front flex flex-col border-b-[8px] border-gray-200">
                                <h2 class="text-6xl font-black px-4">${cardData.word}</h2>
                                <p class="absolute bottom-6 opacity-40 text-sm font-bold uppercase tracking-widest w-full text-center">Click to flip</p>
                            </div>
                            <div class="flip-card-back flex flex-col border-b-[8px] border-black border-opacity-20">
                                <p class="text-3xl font-bold leading-relaxed px-4">${cardData.definition}</p>
                                <p class="absolute bottom-6 opacity-40 text-sm font-bold uppercase tracking-widest w-full text-center">Click to flip</p>
                            </div>
                        </div>
                    </div>
                `;
            }

            window.markKnow = function() {
                // Just move to next card
                currentIndex++;
                renderCard();
            };

            window.markDontKnow = function() {
                // Add the current card to the end of the deck
                const card = cardDeck[currentIndex];
                cardDeck.push(card); // Now it appears again later
                currentIndex++;
                renderCard();
            };

            // initial render
            renderCard();
        });
    </script>
</body>
</html>
