<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | VocabMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-bone { background-color: #F0EFE7; }
        .text-navy { color: #003153; }
        .bg-navy { background-color: #003153; }
    </style>
</head>
<body class="bg-bone text-navy font-sans min-h-screen flex items-center justify-center">
    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-md">
        <h2 class="text-3xl font-black mb-6 text-center">Welcome Back</h2>
        {% if error %}
        <p class="text-red-500 font-bold mb-4 text-center">{{ error }}</p>
        {% endif %}
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block font-bold mb-1">Username</label>
                <input type="text" name="username" required class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-navy outline-none">
            </div>
            <div>
                <label class="block font-bold mb-1">Password</label>
                <input type="password" name="password" required class="w-full border-2 border-gray-200 rounded-xl p-3 focus:border-navy outline-none">
            </div>
            <button type="submit" class="w-full bg-yellow-400 text-navy font-black py-3 rounded-xl hover:bg-yellow-500 shadow-[0_4px_0_rgb(161,98,7)] active:shadow-none active:translate-y-1">Login</button>
        </form>
        <p class="mt-4 text-center text-sm font-bold opacity-70">New here? <a href="{% url 'register' %}" class="text-blue-600">Create Account</a></p>
    </div>
</body>
</html>
