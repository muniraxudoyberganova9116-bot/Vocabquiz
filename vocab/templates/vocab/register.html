{% extends "vocab/base.html" %}
{% block title %}Get started &mdash; Vocab~Master{% endblock %}

{% block content %}
<section class="auth reveal">
    <div class="auth-card surface">
        <span class="eyebrow">Get started</span>
        <h1 class="auth-h">Create your account.</h1>
        <p class="auth-p meta-text">Free. Track your scores and your standing.</p>

        <form method="POST" class="auth-form">
            {% csrf_token %}
            {% if error %}<p class="auth-err">{{ error }}</p>{% endif %}
            <div class="field">
                <label for="id_username">Username</label>
                <input id="id_username" type="text" name="username" required autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="id_password">Password</label>
                <input id="id_password" type="password" name="password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn accent full large">Create account <span class="arrow">&rarr;</span></button>
        </form>

        <p class="auth-alt">Already have an account? <a href="{% url 'login' %}" class="text-link">Sign in</a></p>
    </div>
</section>

<style>
    .auth { display: flex; justify-content: center; padding: 32px 0; }
    .auth-card { width: 100%; max-width: 420px; padding: 28px 28px; display: flex; flex-direction: column; gap: 6px; }
    .auth-h { font-family: var(--serif); font-size: 28px; font-weight: 500; margin: 8px 0 4px; letter-spacing: -0.015em; }
    .auth-p { margin: 0 0 18px; }

    .auth-form { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--t-secondary); }
    .field input {
        background: var(--bg); color: var(--t-primary);
        border: 0.5px solid var(--b-secondary); border-radius: var(--r-md);
        padding: 10px 12px;
        font-family: var(--sans); font-size: 14px;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .auth-err {
        font-family: var(--sans); font-size: 13px; font-weight: 500;
        color: var(--s-danger-fg); background: var(--s-danger-bg);
        padding: 9px 12px; border-radius: var(--r-md); margin: 0;
    }
    .auth-alt { font-family: var(--sans); color: var(--t-secondary); margin: 16px 0 0; font-size: 13px; }
</style>
{% endblock %}
